<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스터디룸 예약 - 한양대학교</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --hy-blue: #1D2475;
            --hy-blue-light: #2d3585;
            --hy-blue-soft: rgba(29, 36, 117, 0.08);
            --hy-gray: #3F3D42;
            --hy-gray-light: #6B6B70;
            --bs-primary: #1D2475;
            --bs-primary-rgb: 29, 36, 117;
        }
        * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f5f6fa; }

        .navbar-main {
            background: linear-gradient(90deg, var(--hy-blue) 0%, #252d7a 100%) !important;
            box-shadow: 0 2px 12px rgba(29, 36, 117, 0.15);
        }
        .navbar-main .navbar-brand { color: #fff !important; font-weight: 700; }
        .navbar-main .text-user { color: rgba(255,255,255,0.9); font-size: 0.9rem; }
        .navbar-main .btn-outline-light:hover { background: rgba(255,255,255,0.2); color: #fff; }

        main { padding-top: 2rem; padding-bottom: 3rem; }
        .section-title { font-weight: 600; color: var(--hy-gray); margin-bottom: 1.25rem; }
        .form-label { color: var(--hy-gray-light); font-weight: 500; }

        #roomBar button, #dateBar button {
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        #roomBar button:hover, #dateBar button:hover {
            transform: translateY(-1px);
        }
        #roomBar, #dateBar {
            padding: 6px 0 4px 0;
            scroll-behavior: smooth;
        }
        #roomBar .btn-primary, #dateBar .btn-primary {
            background: var(--hy-blue);
            border-color: var(--hy-blue);
        }
        #roomBar .btn-outline-primary, #dateBar .btn-outline-primary {
            color: var(--hy-blue);
            border-color: #d0d3e8;
        }
        #roomBar .btn-outline-primary:hover, #dateBar .btn-outline-primary:hover {
            background: var(--hy-blue-soft);
            border-color: var(--hy-blue);
        }

        .slot-btn {
            border-radius: 10px !important;
            padding: 10px 16px !important;
            font-weight: 500;
            transition: all 0.2s ease !important;
        }
        .slot-btn:hover:not(.pe-none) { transform: translateY(-1px); }
        .slot-btn.btn-primary { background: var(--hy-blue) !important; border-color: var(--hy-blue) !important; }
        .slot-btn.btn-outline-secondary { background: #fff; border: 1px solid #c9d4f1; }
        .slot-btn.slot-mine { background: rgba(34, 197, 94, 0.2) !important; border-color: rgba(34, 197, 94, 0.5) !important; color: #166534; cursor: default; }
        .slot-btn.slot-others { background: rgba(239, 68, 68, 0.15) !important; border-color: rgba(239, 68, 68, 0.4) !important; color: #991b1b; cursor: default; }
        .slot-btn.slot-limit { background: #ebeef2 !important; border-color: #adb5bd !important; color: #495057; cursor: not-allowed; opacity: 0.9; }

        #doReserveBtn {
            border-radius: 14px;
            padding: 12px 28px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        #doReserveBtn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(29, 36, 117, 0.3); }

        .my-reservations .res-card {
            border: 1px solid #e8eaef;
            border-radius: 14px;
            transition: all 0.2s ease;
        }
        .my-reservations .res-card:hover {
            box-shadow: 0 4px 16px rgba(29, 36, 117, 0.08);
        }
        .my-reservations .res-room { font-weight: 600; color: var(--hy-blue); }
        .my-reservations .res-empty {
            color: var(--hy-gray-light);
            padding: 2rem;
            text-align: center;
            border: 2px dashed #e0e2eb;
            border-radius: 14px;
            background: #fafbfc;
        }

        .modal-content { border-radius: 20px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
        .modal-header { border-bottom: 1px solid #eee; }
        .modal-footer .btn { border-radius: 12px; padding: 10px 20px; transition: all 0.2s ease; }
        .cancel-btn { border-radius: 10px; transition: all 0.2s ease; }
        #roomBar::-webkit-scrollbar, #dateBar::-webkit-scrollbar { height: 6px; }
        #roomBar::-webkit-scrollbar-thumb, #dateBar::-webkit-scrollbar-thumb { background: #d0d3e8; border-radius: 3px; }
        #roomBar::-webkit-scrollbar-track, #dateBar::-webkit-scrollbar-track { background: #f0f1f5; border-radius: 3px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-main">
        <div class="container">
            <a class="navbar-brand" href="/main">스터디룸 예약</a>
            <div class="d-flex align-items-center">
                {% if user.role.value in ['admin', 'super_admin'] %}
                <a class="btn btn-outline-light btn-sm me-2 fw-bold" href="/admin">관리자 페이지</a>
                {% endif %}
                <span class="text-user me-3">{{ user.name }} ({{ user.dept }})</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">로그아웃</a>
            </div>
        </div>
    </nav>
    <main class="container">
        <!-- 공지사항 카드 -->
        <div id="noticeBoard" class="main-card rounded-4 p-4 mb-4" style="background: #fff; box-shadow: 0 2px 16px rgba(0,0,0,0.06); display: none;">
            <h6 class="section-title mb-3" style="color: var(--hy-blue); font-weight: 700;"><span class="me-2">📢</span>공지사항</h6>
            <div id="noticeContent" class="small"></div>
        </div>

        <div class="main-card rounded-4 p-4 p-md-5 mb-4" style="background: #fff; box-shadow: 0 2px 16px rgba(0,0,0,0.06);">
            <h5 class="section-title">예약하기</h5>
            <div class="mb-2">
                <label class="form-label small">방 선택</label>
                <div id="roomBar" class="d-flex overflow-auto gap-2 pb-2" style="min-height: 44px;"></div>
            </div>
            <div class="mb-2">
                <label class="form-label small">날짜 선택</label>
                <div id="dateBar" class="d-flex overflow-auto gap-2 pb-2" style="min-height: 60px;"></div>
            </div>
            <p class="small text-muted mb-2 fw-bold" id="remainingHours">남은 예약 가능 시간: -</p>
            <div class="mb-3">
                <label class="form-label small">시간 선택 (시작~끝 선택, 최대 3시간)</label>
                <div id="slotGrid" class="d-flex flex-wrap gap-2"></div>
                <p id="slotEmpty" class="text-muted small mt-2" style="display:none;">해당 날짜는 예약할 수 없습니다.</p>
                <div id="reserveBtnArea" class="mt-2" style="display:none;">
                    <button type="button" class="btn btn-primary" id="doReserveBtn">예약하기</button>
                </div>
            </div>
        </div>
        <div class="main-card rounded-4 p-4 p-md-5" style="background: #fff; box-shadow: 0 2px 16px rgba(0,0,0,0.06);">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h6 class="section-title mb-0">내 예약</h6>
                <span class="badge rounded-pill px-3 py-2" style="background: var(--hy-blue-soft); color: var(--hy-blue);" id="myResCount">0건</span>
            </div>
            <div id="myReservations" class="my-reservations"></div>
        </div>
    </main>

    <!-- 예약 확인 모달 -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">예약 확인</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="confirmModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="confirmBtn">예약하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 알림 모달 -->
    <div class="modal fade" id="notificationModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
                <div class="modal-header bg-danger text-white border-0" style="padding: 20px 24px;">
                    <h5 class="modal-title fw-bold">⚠️ 예약 취소 안내</h5>
                </div>
                <div class="modal-body" style="padding: 24px;">
                    <p class="text-secondary mb-3">관리자에 의해 예약이 취소되었습니다. 상세 내용은 다음과 같습니다.</p>
                    <div class="p-3 rounded-3 mb-3" style="background: #f8f9fa; border: 1px solid #e9ecef;">
                        <div class="mb-2"><strong>장소:</strong> <span id="notifRoomName" class="fw-bold text-dark"></span></div>
                        <div class="mb-2"><strong>시간:</strong> <span id="notifTimeRange"></span></div>
                        <div class="mb-0"><strong>취소 사유:</strong> <span id="notifReason" class="text-danger fw-bold"></span></div>
                    </div>
                </div>
                <div class="modal-footer border-0" style="padding: 16px 24px;">
                    <button type="button" class="btn btn-danger w-100 fw-bold" id="notifConfirmBtn" style="border-radius: 12px; padding: 12px;">확인하였습니다</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function(){
            let rooms = [], selectedDate = '', selectedRoomId = 0, pendingSlot = null;
            let appConfig = { max_advance_days: 7, holidays: [], is_exam_period: false };
            const DAYS = ['일','월','화','수','목','금','토'];

            async function api(path, opts = {}) {
                const r = await fetch(path, { credentials: 'include', ...opts });
                if (r.status === 401) { window.location = '/login'; return null; }
                if (r.status === 403) { alert('권한이 없습니다.'); return null; }
                if (!r.ok) { try { const e = await r.json(); alert(e.detail || '오류'); } catch(_){ alert('오류'); } return null; }
                return r.status === 204 ? null : r.json();
            }

            function toLocalDateStr(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }
            function todayStr() { return toLocalDateStr(new Date()); }
            function dateStr(d) { return toLocalDateStr(d); }

            function scrollToCenter(container, element) {
                const targetLeft = Math.max(0, element.offsetLeft - (container.clientWidth / 2) + (element.offsetWidth / 2));
                const startLeft = container.scrollLeft;
                const distance = targetLeft - startLeft;
                const duration = 420;
                const startTime = performance.now();
                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
                    container.scrollLeft = startLeft + distance * ease;
                    if (progress < 1) requestAnimationFrame(animate);
                }
                requestAnimationFrame(animate);
            }

            function buildDateBar() {
                const bar = document.getElementById('dateBar');
                bar.innerHTML = '';
                const today = new Date();
                let count = 0, i = 0;
                const isExam = appConfig.is_exam_period || false;
                const limit = appConfig.max_advance_days || 7;
                while (count < limit && i < 30) {
                    const d = new Date(today);
                    d.setDate(today.getDate() + i);
                    const ds = dateStr(d);
                    const dayOfWeek = d.getDay();
                    const isWknd = (dayOfWeek === 0); // 일요일

                    const isHol = appConfig.holidays.includes(ds);
                    
                    if (!isExam && isWknd) { i++; continue; }
                    if (!isExam && isHol) { i++; continue; }
                    
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn btn-sm btn-outline-primary flex-shrink-0';
                    const m = d.getMonth() + 1;
                    const dateVal = d.getDate();
                    const label = `${m}/${dateVal}(${DAYS[dayOfWeek]})`;
                    btn.textContent = label;
                    btn.dataset.date = ds;
                    btn.onclick = function() {
                        selectedDate = this.dataset.date;
                        bar.querySelectorAll('button').forEach(b => {
                            b.classList.remove('btn-primary');
                            b.classList.add('btn-outline-primary');
                        });
                        this.classList.remove('btn-outline-primary');
                        this.classList.add('btn-primary');
                        scrollToCenter(bar, this);
                        selectedStartIdx = -1; selectedEndIdx = -1;
                        document.getElementById('reserveBtnArea').style.display = 'none';
                        loadSlots();
                        loadRemaining();
                    };
                    if (count === 0) {
                        btn.classList.remove('btn-outline-primary');
                        btn.classList.add('btn-primary');
                        selectedDate = ds;
                    }
                    bar.appendChild(btn);
                    count++;
                    i++;
                }
            }

            async function loadRooms() {
                const list = await api('/api/rooms');
                if (!list) return;
                rooms = list;
                const bar = document.getElementById('roomBar');
                bar.innerHTML = rooms.map((r, idx) => {
                    const active = idx === 0 ? 'btn-primary' : 'btn-outline-primary';
                    if (idx === 0) selectedRoomId = r.id;
                    return `<button type="button" class="btn btn-sm ${active} flex-shrink-0" data-id="${r.id}">${r.name}</button>`;
                }).join('');
                bar.querySelectorAll('button').forEach(btn => btn.onclick = function() {
                    selectedRoomId = parseInt(this.dataset.id);
                    bar.querySelectorAll('button').forEach(b => {
                        b.classList.remove('btn-primary');
                        b.classList.add('btn-outline-primary');
                    });
                    this.classList.remove('btn-outline-primary');
                    this.classList.add('btn-primary');
                    scrollToCenter(bar, this);
                    selectedStartIdx = -1; selectedEndIdx = -1;
                    document.getElementById('reserveBtnArea').style.display = 'none';
                    loadSlots();
                });
            }

            let slotsData = [], selectedStartIdx = -1, selectedEndIdx = -1;
            async function loadSlots() {
                if (!selectedRoomId || !selectedDate) return;
                const data = await api(`/api/slots?room_id=${selectedRoomId}&date=${selectedDate}`);
                const grid = document.getElementById('slotGrid');
                const empty = document.getElementById('slotEmpty');
                if (!data) return;
                slotsData = data;
                if (!slotsData.length) {
                    grid.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';
                grid.innerHTML = slotsData.map((s, idx) => {
                    const startStr = s.start.slice(11, 16);
                    let cls = 'btn-outline-secondary';
                    let disabled = '';
                    if (s.mine) { cls = 'slot-mine'; disabled = 'pe-none'; }
                    else if (s.occupied) { cls = 'slot-others'; disabled = 'pe-none'; }
                    else if (!s.available) { cls = 'slot-limit'; disabled = 'pe-none'; }
                    return `<button type="button" class="btn slot-btn ${cls}" ${disabled} data-idx="${idx}">${startStr}</button>`;
                }).join('');
                grid.querySelectorAll('button:not(.pe-none)').forEach(btn => btn.onclick = function() {
                    const idx = parseInt(this.dataset.idx);
                    handleSlotSelect(idx);
                });
                updateSlotStyles();
            }

            function updateSlotStyles() {
                const grid = document.getElementById('slotGrid');
                const buttons = grid.querySelectorAll('button:not(.pe-none)');
                const start = Math.min(selectedStartIdx, selectedEndIdx);
                const end = Math.max(selectedStartIdx, selectedEndIdx);
                buttons.forEach(btn => {
                    const idx = parseInt(btn.dataset.idx);
                    btn.classList.remove('btn-primary', 'btn-outline-secondary');
                    if (selectedStartIdx >= 0 && selectedEndIdx >= 0 && idx >= start && idx <= end) {
                        btn.classList.add('btn-primary');
                    } else if (idx === selectedStartIdx) {
                        btn.classList.add('btn-primary');
                    } else {
                        btn.classList.add('btn-outline-secondary');
                    }
                });
            }

            function handleSlotSelect(idx) {
                const MAX_SLOTS = 6;
                if (selectedStartIdx < 0) {
                    // 아무 슬롯도 선택되지 않은 상태: 클릭한 슬롯을 시작/종료 슬롯으로 설정 (30분 예약 지원)
                    selectedStartIdx = idx;
                    selectedEndIdx = idx;
                } else if (selectedStartIdx === selectedEndIdx) {
                    // 정확히 1개 슬롯만 선택된 상태
                    if (idx === selectedStartIdx) {
                        // 같은 슬롯을 다시 클릭하면 선택 해제
                        selectedStartIdx = -1;
                        selectedEndIdx = -1;
                    } else {
                        // 다른 슬롯을 클릭하면 범위(시작~종료) 지정 시도
                        const start = Math.min(selectedStartIdx, idx);
                        const end = Math.max(selectedStartIdx, idx);
                        if (end - start + 1 > MAX_SLOTS) {
                            selectedStartIdx = idx;
                            selectedEndIdx = idx;
                        } else {
                            const allAvail = Array.from({length: end-start+1}, (_,i)=>slotsData[start+i].available).every(Boolean);
                            if (allAvail) {
                                selectedStartIdx = start;
                                selectedEndIdx = end;
                            } else {
                                selectedStartIdx = idx;
                                selectedEndIdx = idx;
                            }
                        }
                    }
                } else {
                    // 이미 범위가 지정된 상태에서 아무 슬롯이나 클릭하면, 해당 단일 슬롯 선택으로 재설정
                    selectedStartIdx = idx;
                    selectedEndIdx = idx;
                }
                updateSlotStyles();
                const area = document.getElementById('reserveBtnArea');
                if (selectedStartIdx >= 0 && selectedEndIdx >= 0) {
                    area.style.display = 'block';
                } else {
                    area.style.display = 'none';
                }
            }

            async function loadRemaining() {
                if (!selectedDate) return;
                const data = await api(`/api/slots/remaining?date=${selectedDate}`);
                const el = document.getElementById('remainingHours');
                let text = '남은 예약 가능 시간: -';
                if (data) {
                    if (data.is_exam_period) {
                        text = `남은 예약 가능 시간: 총 ${data.remaining_hours}시간 (주간: ${data.remaining_day_hours}시간 / 새벽: ${data.remaining_dawn_hours}시간)`;
                    } else {
                        text = `남은 예약 가능 시간: ${data.remaining_hours}시간`;
                    }
                }
                el.textContent = text;
                const isZero = data && (data.remaining_hours === 0 || parseFloat(data.remaining_hours) <= 0);
                if (isZero) {
                    el.style.setProperty('color', '#dc3545', 'important');
                    el.style.setProperty('font-weight', '600', 'important');
                } else {
                    el.style.removeProperty('color');
                    el.style.removeProperty('font-weight');
                }
            }

            document.getElementById('doReserveBtn').onclick = () => {
                if (selectedStartIdx < 0 || selectedEndIdx < 0 || !slotsData.length) return;
                const lo = Math.min(selectedStartIdx, selectedEndIdx);
                const hi = Math.max(selectedStartIdx, selectedEndIdx);
                pendingSlot = { start: slotsData[lo].start, end: slotsData[hi].end };
                const room = rooms.find(r => r.id === selectedRoomId);
                document.getElementById('confirmModalBody').innerHTML =
                    `<p>${room?.name || ''} / ${selectedDate}</p><p>${pendingSlot.start.slice(11,16)} ~ ${pendingSlot.end.slice(11,16)}</p><p class="text-muted small">예약하시겠습니까?</p>`;
                new bootstrap.Modal(document.getElementById('confirmModal')).show();
            };

            document.getElementById('confirmBtn').onclick = async () => {
                if (!pendingSlot) return;
                const body = { room_id: selectedRoomId, start_time: pendingSlot.start, end_time: pendingSlot.end };
                const res = await api('/api/reservations', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
                bootstrap.Modal.getInstance(document.getElementById('confirmModal')).hide();
                pendingSlot = null;
                if (res) {
                    selectedStartIdx = -1; selectedEndIdx = -1;
                    document.getElementById('reserveBtnArea').style.display = 'none';
                    loadSlots(); loadRemaining(); loadMyReservations();
                }
            };

            function formatResDate(iso) {
                const d = new Date(iso);
                const m = d.getMonth() + 1, day = d.getDate(), w = DAYS[d.getDay()];
                return `${m}월 ${day}일 (${w})`;
            }
            function formatResTime(iso) { return iso.slice(11, 16); }
            function getDurationHours(startIso, endIso) {
                const a = new Date(startIso), b = new Date(endIso);
                return ((b - a) / 3600000).toFixed(1);
            }

            async function loadMyReservations() {
                const data = await api('/api/reservations/mine');
                const el = document.getElementById('myReservations');
                const countEl = document.getElementById('myResCount');
                if (!data || !data.length) {
                    el.innerHTML = '<div class="res-empty"><span class="small">예약한 스터디룸이 없습니다.</span></span></div>';
                    if (countEl) countEl.textContent = '0건';
                    return;
                }
                if (countEl) countEl.textContent = data.length + '건';
                const byDate = {};
                data.forEach(r => {
                    const dt = r.start_time.slice(0, 10);
                    if (!byDate[dt]) byDate[dt] = [];
                    byDate[dt].push(r);
                });
                const dates = Object.keys(byDate).sort();
                el.innerHTML = dates.map(dt => {
                    const items = byDate[dt];
                    const dateLabel = formatResDate(items[0].start_time);
                    return `
                    <div class="mb-3">
                        <div class="small text-muted mb-1">${dateLabel}</div>
                        <div class="d-flex flex-column gap-2">
                            ${items.map(r => {
                                const startT = formatResTime(r.start_time);
                                const endT = formatResTime(r.end_time);
                                const hrs = getDurationHours(r.start_time, r.end_time);
                                const cancelable = r.cancelable !== false;
                                const canEarlyCheckout = r.can_early_checkout === true;
                                let actionBtn = '';
                                if (cancelable) {
                                    actionBtn = '<button class="btn btn-outline-danger btn-sm cancel-btn" data-id="' + r.id + '">취소</button>';
                                } else if (canEarlyCheckout) {
                                    actionBtn = '<button class="btn btn-outline-primary btn-sm early-checkout-btn" data-id="' + r.id + '">퇴실</button>';
                                }
                                return `
                                <div class="res-card p-3 d-flex justify-content-between align-items-center">
                                    <div>
                                        <span class="res-room">${r.room_name}</span>
                                        <span class="text-muted small ms-1">${startT} ~ ${endT}</span>
                                        <span class="badge ms-1" style="background: var(--hy-blue-soft); color: var(--hy-blue);">${hrs}시간</span>
                                    </div>
                                    ${actionBtn ? '<div class="d-flex gap-1">' + actionBtn + '</div>' : ''}
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    `;
                }).join('');
                el.querySelectorAll('.cancel-btn').forEach(btn => btn.addEventListener('click', async () => {
                    if (!confirm('예약을 취소하시겠습니까?')) return;
                    await api('/api/reservations/' + btn.dataset.id, { method: 'DELETE' });
                    loadMyReservations(); loadSlots(); loadRemaining();
                }));
                el.querySelectorAll('.early-checkout-btn').forEach(btn => btn.addEventListener('click', async () => {
                    if (!confirm('중도 퇴실하시겠습니까? 사용한 시간은 슬롯 단위로 올림 처리됩니다.')) return;
                    await api('/api/reservations/' + btn.dataset.id + '/early-checkout', { method: 'POST' });
                    loadMyReservations(); loadSlots(); loadRemaining();
                }));
            }

            async function loadNotices() {
                const data = await api('/api/notices');
                const board = document.getElementById('noticeBoard');
                const content = document.getElementById('noticeContent');
                if (!data || data.length === 0) {
                    board.style.display = 'none';
                    return;
                }
                board.style.display = 'block';
                content.innerHTML = data.map(n => {
                    const formattedDate = n.created_at.slice(0, 10);
                    return `
                        <div class="mb-3 pb-3 border-bottom" style="border-color: #f0f1f5 !important;">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="fw-bold text-dark">${n.title}</span>
                                <span class="text-muted small" style="font-size: 0.75rem;">${formattedDate}</span>
                            </div>
                            <div class="text-secondary small" style="white-space: pre-wrap; line-height: 1.5;">${n.content}</div>
                        </div>
                    `;
                }).join('');
                if (content.lastElementChild) {
                    content.lastElementChild.classList.remove('border-bottom');
                    content.lastElementChild.classList.remove('pb-3');
                    content.lastElementChild.classList.remove('mb-3');
                }
            }

            let notificationQueue = [];
            async function checkNotifications() {
                const data = await api('/api/notifications');
                if (data && data.length > 0) {
                    notificationQueue = data;
                    showNextNotification();
                }
            }

            function showNextNotification() {
                if (notificationQueue.length === 0) return;
                const notif = notificationQueue[0];
                document.getElementById('notifRoomName').textContent = notif.room_name;
                const dateStr = notif.start_time.slice(0, 10);
                const timeRange = `${dateStr} ${notif.start_time.slice(11, 16)} ~ ${notif.end_time.slice(11, 16)}`;
                document.getElementById('notifTimeRange').textContent = timeRange;
                document.getElementById('notifReason').textContent = notif.cancel_reason || '사유가 입력되지 않았습니다.';
                
                const myModal = new bootstrap.Modal(document.getElementById('notificationModal'));
                document.getElementById('notifConfirmBtn').onclick = async () => {
                    await api(`/api/notifications/${notif.id}/read`, { method: 'POST' });
                    myModal.hide();
                    notificationQueue.shift();
                    setTimeout(showNextNotification, 500);
                };
                myModal.show();
            }

            document.addEventListener('DOMContentLoaded', async () => {
                const confirmModal = document.getElementById('confirmModal');
                if (confirmModal) {
                    confirmModal.addEventListener('hide.bs.modal', function() {
                        if (document.activeElement && this.contains(document.activeElement)) {
                            document.activeElement.blur();
                        }
                    });
                }
                const cfg = await api('/api/config');
                if (cfg) {
                    appConfig.max_advance_days = cfg.max_advance_days ?? 7;
                    appConfig.holidays = cfg.holidays || [];
                    appConfig.is_exam_period = cfg.is_exam_period === true;
                }
                buildDateBar();
                await loadRooms();
                if (!selectedDate) selectedDate = todayStr();
                await loadSlots();
                await loadRemaining();
                await loadMyReservations();
                await loadNotices();
                await checkNotifications();
            });
        })();
    </script>
</body>
</html>
