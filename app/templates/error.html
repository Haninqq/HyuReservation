<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} · 스터디룸 예약</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/static/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --hy-blue: #1D2475;
            --hy-blue-light: #2d3585;
            --hy-blue-soft: rgba(29, 36, 117, 0.08);
            --hy-gray: #3F3D42;
            --hy-gray-light: #6B6B70;
        }
        * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        html, body { min-height: 100%; }
        body {
            background: #fff;
            display: flex;
            flex-direction: column;
        }
        .navbar-main {
            background: linear-gradient(90deg, var(--hy-blue) 0%, #252d7a 100%) !important;
            box-shadow: 0 2px 12px rgba(29, 36, 117, 0.15);
        }
        .navbar-main .navbar-brand { color: #fff !important; font-weight: 700; }
        .navbar-main .btn-outline-light:hover { background: rgba(255,255,255,0.2); color: #fff; }

        .error-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: min(88vh, 900px);
            padding: clamp(2rem, 5vw, 4rem) 0;
        }
        .error-hero-inner {
            width: 100%;
            max-width: 1320px;
            margin: 0 auto;
            padding: 0 clamp(1.25rem, 5vw, 3.5rem);
        }

        .display-oops {
            font-size: clamp(4rem, 14vw, 9rem);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -0.06em;
            color: var(--hy-gray);
            margin-bottom: 0.35rem;
            animation: pop-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes pop-in {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .error-title-line {
            font-size: clamp(1.35rem, 2.8vw, 1.85rem);
            font-weight: 700;
            color: var(--hy-gray);
            line-height: 1.35;
            margin-bottom: 1rem;
            animation: fade-up 0.6s 0.08s ease both;
        }
        .error-msg-line {
            font-size: clamp(1rem, 1.6vw, 1.125rem);
            font-weight: 500;
            color: var(--hy-gray-light);
            line-height: 1.65;
            max-width: 32rem;
            margin-bottom: 1.25rem;
            animation: fade-up 0.6s 0.14s ease both;
        }
        .error-code-line {
            font-size: 0.875rem;
            color: #9ca3af;
            margin-bottom: 2rem;
            animation: fade-up 0.6s 0.2s ease both;
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .help-links-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--hy-gray);
            margin-bottom: 0.65rem;
            animation: fade-up 0.6s 0.26s ease both;
        }
        .help-links {
            list-style: none;
            padding: 0;
            margin: 0;
            animation: fade-up 0.6s 0.32s ease both;
        }
        .help-links li {
            margin-bottom: 0.45rem;
        }
        .help-links a {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--hy-blue);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease, color 0.2s ease;
        }
        .help-links a:hover {
            border-bottom-color: var(--hy-blue);
            color: var(--hy-blue-light);
        }

        .mascot-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            min-height: clamp(220px, 40vh, 420px);
            animation: fade-up 0.7s 0.15s ease both;
        }
        .mascot-shadow {
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            width: min(70%, 340px);
            height: 28px;
            background: radial-gradient(ellipse at center, rgba(29,36,117,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }
        .mascot-img {
            position: relative;
            width: min(92vw, 480px);
            max-height: min(50vh, 440px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 12px 28px rgba(29, 36, 117, 0.12));
            animation: floaty 4s ease-in-out infinite;
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 991px) {
            .mascot-stage { margin-bottom: 1.5rem; min-height: auto; }
            .text-col { text-align: center; }
            .error-msg-line { margin-left: auto; margin-right: auto; }
            .help-links { display: inline-block; text-align: left; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-main">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand" href="/main">스터디룸 예약</a>
            <div class="d-flex align-items-center gap-2">
                <a href="/" class="btn btn-outline-light btn-sm d-none d-sm-inline-block">메인</a>
                <a href="/login" class="btn btn-outline-light btn-sm">로그인</a>
            </div>
        </div>
    </nav>

    <section class="error-hero" aria-labelledby="error-heading">
        <div class="error-hero-inner">
            <div class="row align-items-center g-4 g-xl-5">
                <div class="col-lg-6 order-lg-1 order-2 text-col">
                    <p class="display-oops" aria-hidden="true">앗!</p>
                    <h1 id="error-heading" class="error-title-line">{{ title }}</h1>
                    <p class="error-msg-line">{{ message }}</p>
                    <p class="error-code-line">오류 코드: <strong>{{ status_code }}</strong></p>
                    <p class="help-links-title">다음 링크가 도움이 될 수 있어요</p>
                    <ul class="help-links">
                        <li><a href="/main">스터디룸 예약 화면</a></li>
                        <li><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">이건 절대 클릭하지 마세요!</a></li>
                    </ul>
                </div>
                <div class="col-lg-6 order-lg-2 order-1">
                    <div class="mascot-stage">
                        <div class="mascot-shadow" aria-hidden="true"></div>
                        <img class="mascot-img" src="{{ mascot_src }}" alt="" width="480" height="480">
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
