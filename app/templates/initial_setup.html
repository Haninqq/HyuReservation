<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 정보 입력 - 스터디룸 예약</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --hy-blue: #1D2475;
            --hy-blue-light: #2d3585;
            --hy-blue-soft: rgba(29, 36, 117, 0.08);
            --hy-gray: #3F3D42;
            --hy-gray-light: #6B6B70;
        }
        * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh;
            background: #f5f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .setup-box {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.03);
            padding: 3rem;
            max-width: 440px;
            width: 100%;
        }
        .setup-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }
        .setup-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: linear-gradient(180deg, #2d3585 0%, var(--hy-blue) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        .setup-icon span {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }
        .setup-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--hy-gray);
            line-height: 1.35;
            margin-bottom: 0.5rem;
        }
        .setup-subtitle {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--hy-gray-light);
            margin-bottom: 2rem;
        }
        .setup-form { width: 100%; }
        .setup-option {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            border: 2px solid #e8e8ec;
            border-radius: 14px;
            margin-bottom: 0.75rem;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--hy-gray);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .setup-option:hover {
            border-color: var(--hy-blue);
            background: var(--hy-blue-soft);
            color: var(--hy-blue);
        }
        .setup-option.selected {
            border-color: var(--hy-blue);
            background: var(--hy-blue-soft);
            color: var(--hy-blue);
        }
        .setup-option:active {
            transform: scale(0.98);
        }
        .form-select {
            border-radius: 12px;
            border: 2px solid #e8e8ec;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 550;
            color: var(--hy-gray);
            transition: all 0.2s ease;
        }
        .form-select:focus {
            border-color: var(--hy-blue);
            box-shadow: 0 0 0 3px var(--hy-blue-soft);
        }
        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 24px;
            margin-top: 1.5rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(180deg, #2d3585 0%, var(--hy-blue) 100%);
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            opacity: 0.9;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="setup-box">
        <div class="setup-wrap">
            <div class="setup-icon"><span>H</span></div>
            <h1 class="setup-title">회원 정보 입력</h1>
            <p class="setup-subtitle">서비스 이용을 위해 아래에서 해당하는 항목을 선택해 주세요</p>
            <form id="setupForm" action="/auth/complete_setup" method="POST" class="setup-form">
                <input type="hidden" name="is_graduate" id="isGraduateInput" value="0">
                <div class="setup-option selected" data-is-graduate="0">학부생</div>
                <div class="setup-option" data-is-graduate="1">대학원생</div>
                
                <!-- 대학원 전공 선택 (대학원생 선택 시 표출) -->
                <div class="mb-3 text-start" id="deptSelectContainer" style="display: none;">
                    <label class="form-label small fw-bold text-muted mb-2">대학원 전공 선택</label>
                    <select class="form-select" name="dept" id="deptSelect">
                        <option value="" disabled selected>전공을 선택해주세요</option>
                        <!-- 일반대학원 -->
                        <option value="교육공학과">교육공학과</option>
                        <option value="러닝사이언스학과">러닝사이언스학과</option>
                        <option value="응용미술학과">응용미술학과</option>
                        <option value="한국어교육학과">한국어교육학과</option>
                        <option value="박물관교육학과">박물관교육학과</option>
                        <option value="다문화교육학과">다문화교육학과</option>
                        <option value="평생학습학과">평생학습학과</option>
                        <!-- 교육대학원 -->
                        <option value="상담심리">상담심리</option>
                        <option value="유아교육">유아교육</option>
                        <option value="교육공학">교육공학</option>
                        <option value="국어교육">국어교육</option>
                        <option value="영어교육">영어교육</option>
                        <option value="수학교육">수학교육</option>
                        <option value="일반사회교육">일반사회교육</option>
                        <option value="음악교육">음악교육</option>
                        <option value="미술교육">미술교육</option>
                        <option value="체육교육">체육교육</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">시작하기</button>
            </form>
        </div>
    </div>
    <script>
        document.querySelectorAll('.setup-option').forEach(function(el) {
            el.addEventListener('click', function() {
                document.querySelectorAll('.setup-option').forEach(function(o) { o.classList.remove('selected'); });
                this.classList.add('selected');
                
                const isGraduate = this.dataset.isGraduate;
                document.getElementById('isGraduateInput').value = isGraduate;
                
                const deptContainer = document.getElementById('deptSelectContainer');
                const deptSelect = document.getElementById('deptSelect');
                if (isGraduate === "1") {
                    deptContainer.style.display = 'block';
                    deptSelect.setAttribute('required', 'required');
                } else {
                    deptContainer.style.display = 'none';
                    deptSelect.removeAttribute('required');
                    deptSelect.value = ""; // Reset value
                }
            });
        });
    </script>
</body>
</html>
